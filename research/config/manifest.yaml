# Phase 03A specification work over the unchanged Phase 02 implementation.
# This is a tested development configuration, not a performance experiment.
project:
  name: Pluto
  research_title: Evaluation of Resource Cost and Processing Correctness for Hybrid secp256k1–ML-DSA-44 Transactions in a CometBFT-Based Blockchain Application under Deliberately Invalid Input Workloads
  phase: "03A"
  implementation_status: single_validator_empty_block_foundation
  phase_03a_specification_authorized: true
  phase_03b_implementation_authorized: false
  evm_decision: conditional_phase_04_after_b0_core
  b0_protocol_status: proposed_pending_controller_owner_review
application:
  version: 0.2.0-foundation
  state_format_version: 1
  module_path: example.com/pluto
  module_path_status: provisional_migration_required
source:
  source_branch: test-mainet
  source_commit: ab1d1746fdd70bc0bbf00f20a186663f3cacf2ab
  working_branch: phase/03a-tx-protocol
  result_commit: recorded_in_phase_03a_final_chat_and_draft_pr
  phase_01_baseline_manifest: research/evidence/phase_02/BASELINE_SHA256.txt
  phase_02_source_manifest: research/evidence/phase_02/RESULT_SHA256.txt
toolchain:
  go_observed: go1.24.1
  go_mod_minimum: "1.24.0"
  platform_observed: linux/amd64
dependencies:
  current_third_party: cometbft_and_pebble_with_transitives
  cometbft:
    module: github.com/cometbft/cometbft
    selected_version: v0.38.26
    status: pinned_compiled_integrated_single_validator_tested
  evm:
    module: github.com/ethereum/go-ethereum
    candidate_version: v1.16.8
    status: provisional_module_metadata_checked_integration_unverified
  storage:
    module: github.com/cockroachdb/pebble
    selected_version: v1.1.5
    status: pinned_sync_write_reload_and_restart_tested
  mldsa44:
    module: github.com/cloudflare/circl
    candidate_version: v1.6.4
    status: provisional_api_and_vectors_unverified
environment:
  operating_system: WSL2_Ubuntu_linux_amd64
  docker: unavailable
  deployment: local_single_validator
  rpc_default: 127.0.0.1:26657
  p2p_default: 127.0.0.1:26656
  abci_default: 127.0.0.1:26658
  empty_block_interval: 1s
build:
  command: make build
  configuration: standard_go_compiler_with_revision_ldflag
  binaries: build/plutod_and_build/cometbft
verification:
  status: phase_03a_required_checks_passed_protocol_review_pending
  suite: git_diff_check_make_verify_make_test-integration
  evidence: research/evidence/phase_03a/
  limitations: graceful_restart_only_no_power_loss_or_four_validator_test
experiments:
  status: not_applicable
  results: none
